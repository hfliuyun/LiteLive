name: ctest-ci
on:
  push:
  pull_request:

jobs:
  build-test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      #拉代码
      - uses: actions/checkout@v4

      # 安装构建工具
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build

      #配置 sanitizer标志
      - name: configure
        run: |
          cmake -S . -B build-ci \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      # 编译
      - name: build
        run: cmake --build build-ci

      #有界单测（注：E2E/负载脚本需 ffmpeg 且跑真服务，只在本地跑，不进 CI）
      - name: test
        run: ctest --test-dir build-ci --output-on-failure

  build-test-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # 一般自带 cmake；ninja 可选
      - run: brew install ninja
      - run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - run: cmake --build build-ci
      - run: ctest --test-dir build-ci --output-on-failure
